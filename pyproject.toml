[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covctl"
version = "0.1.0"
description = "Covenant compiler, policy linter and digest for GenLayer CovenantGuard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vincentofweb3" }]
keywords = ["genlayer", "intelligent-contracts", "covenant", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
covctl = "covctl:main"

[tool.setuptools]
py-modules = ["covctl"]
